<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="utf-8">
<title>Inicio de sesión</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
<style>
body {
    background: linear-gradient(135deg, var(--bg-navbar), var(--text-main));
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.login-container {
    background: white;
    padding: 2.5rem;
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 400px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    text-align: center;
}

.login-container img {
    height: 48px;
    margin-bottom: 1.5rem;
    border-radius: 8px;
}

.login-container h2 {
    margin-bottom: 2rem;
    font-weight: 700;
}

.form-group {
    text-align: left;
    margin-bottom: 1.25rem;
}

.form-group label {
    font-size: 0.875rem;
    color: var(--text-muted);
    font-weight: 500;
    margin-bottom: 0.5rem;
    display: block;
}

.form-group input {
    width: 100%;
    padding: 0.75rem 1rem;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
    font-size: 0.95rem;
    transition: all 0.2s;
    font-family: inherit;
}

.form-group input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
}

.login-btn {
    width: 100%;
    padding: 0.75rem;
    border: none;
    border-radius: var(--radius-md);
    background: var(--primary);
    color: white;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 1rem;
}

.login-btn:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
}
</style>
</head>
<body>

<div class="login-container">
    <img src="/static/logo.png" alt="Logo">
    <h2>Iniciar sesión</h2>

    {% if error %}
    <div style="background: #fee2e2; color: var(--danger); padding: 10px; border-radius: var(--radius-md); margin-bottom: 1.5rem; font-size: 0.875rem; font-weight: 500; border: 1px solid var(--bg-surface);">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/admin?next={{ request.query_params.get('next', '') }}">
        <div class="form-group">
            <label>Usuario</label>
            <input name="user" placeholder="Ingrese su usuario" required>
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="login-btn">Entrar al Sistema</button>
    </form>
</div>

</body>
</html>
